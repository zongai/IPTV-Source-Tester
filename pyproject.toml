[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iptv-source-tester"
version = "0.5.0"
description = "IPTV Source Tester V4"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "aiohttp>=3.10,<4",
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "jinja2>=3.1,<4",
  "typer>=0.12,<1",
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]
[project.scripts]
iptv = "app.cli:app"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
